name: wisme_app2
description: "AI-Powered Microlearning That Feels Like a Podcast"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  
  # Firebase services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
 
  
  # Audio and TTS
  audioplayers: ^6.1.0
  flutter_tts: ^4.1.0
  
  # State management
  provider: ^6.1.2
  
  # Network and HTTP
  http: ^1.2.2
  dio: ^5.7.0
  
  # Local storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^8.0.0
  sqflite: ^2.3.3
  
  # Utilities
  crypto: ^3.0.5
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  
  # Google Sign In
  google_sign_in: ^6.2.1
  
  # Development utilities
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/fonts/
  
  # Custom fonts will be added in production
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Roboto-Light.ttf
  #         weight: 300
