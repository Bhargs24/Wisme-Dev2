name: wisme_app
description: "Wisme - AI-Powered Daily Learning Platform. Learn anything in 10 minutes daily with personalized AI coaches."

publish_to: 'none' # Private app

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System  
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Networking & API (for ElevenLabs)
  http: ^1.1.0

  # Storage (minimal)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # App Icons
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
