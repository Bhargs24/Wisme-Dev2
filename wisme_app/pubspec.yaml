name: wisme_app
description: "Wisme - AI-Powered Daily Learning Platform. Learn anything in 10 minutes daily with personalized AI coaches."

publish_to: 'none' # Private app

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.5.1
  provider: ^6.1.2

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Navigation
  go_router: ^14.6.1
  auto_route: ^9.2.2

  # Audio & Media
  just_audio: ^0.9.40
  audioplayers: ^6.1.0
  audio_waveforms: ^1.1.0
  flutter_sound: ^9.16.3

  # Storage & Database
  supabase_flutter: ^2.8.1
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Networking & API
  dio: ^5.7.0
  retrofit: ^4.5.0
  json_annotation: ^4.9.0
  http: ^1.4.0
  
  # Charts & Analytics
  fl_chart: ^0.69.0
  
  # Environment Configuration
  flutter_dotenv: ^5.1.0

  # Authentication
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # Analytics & Monitoring
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.1.8
  firebase_analytics: ^11.3.8

  # Push Notifications
  firebase_messaging: ^15.1.8
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0

  # Animations & UI Effects
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Development & Debugging
  logger: ^2.4.0
  pretty_dio_logger: ^1.4.0
  crypto: ^3.0.6
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^5.0.0
  custom_lint: ^0.7.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.5.1
  auto_route_generator: ^9.0.0
  retrofit_generator: ^9.1.4
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Custom fonts and assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
    - .env


  # see https://flutter.dev/to/font-from-package
